name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, tests and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://loopambiental:loopambiental_local@127.0.0.1:3306/loopambiental
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @loopambiental/database generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_URL: mysql://loopambiental:loopambiental_local@127.0.0.1:3306/loopambiental
      REDIS_URL: redis://127.0.0.1:6379
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001/api/v1
      WEB_ORIGIN: http://127.0.0.1:3000
      WEB_PUBLIC_URL: http://127.0.0.1:3000
      ADMIN_EMAILS: admin@loopambiental.com
      FIELD_ENCRYPTION_KEY: ci-field-encryption-key
      AUTH_THROTTLE_LIMIT: 1000
      STORAGE_ENDPOINT: http://127.0.0.1:9000
      STORAGE_BUCKET: loopambiental-listings
      STORAGE_ACCESS_KEY: loopambiental
      STORAGE_SECRET_KEY: loopambiental_local
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_API_URL: http://127.0.0.1:3001/api/v1
      E2E_WEB_ORIGIN: http://127.0.0.1:3000
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: loopambiental
          MYSQL_USER: loopambiental
          MYSQL_PASSWORD: loopambiental_local
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @loopambiental/database generate

      # Scripts load ../../.env via --env-file; values exported by this job
      # take precedence over the file, which only fills the remaining defaults.
      - name: Create .env from example
        run: cp .env.example .env

      - name: Apply migrations
        run: pnpm --filter @loopambiental/database db:deploy

      # MinIO needs a "server" command, which service containers cannot set.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=loopambiental \
            -e MINIO_ROOT_PASSWORD=loopambiental_local \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then break; fi
            sleep 1
          done

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start API
        run: pnpm --filter @loopambiental/api dev > api.log 2>&1 &

      - name: Start web
        run: pnpm --filter @loopambiental/web dev > web.log 2>&1 &

      - name: Wait for API and web
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/v1/health >/dev/null; then break; fi
            sleep 2
          done
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then break; fi
            sleep 2
          done

      - name: Seed admin account and plans
        run: |
          curl -fsS -X POST http://127.0.0.1:3001/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://127.0.0.1:3000' -H 'X-App-Action: 1' \
            -d '{"name":"Admin E2E","email":"admin@loopambiental.com","password":"loopambiental"}' >/dev/null
          mysql -h 127.0.0.1 -P 3306 -u loopambiental -ploopambiental_local loopambiental < e2e/support/seed.sql

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            api.log
            web.log
            playwright-report
            test-results
          if-no-files-found: ignore
