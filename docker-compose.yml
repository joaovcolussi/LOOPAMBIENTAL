services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: loopambiental_root_local
      MYSQL_DATABASE: loopambiental
      MYSQL_USER: loopambiental
      MYSQL_PASSWORD: loopambiental_local
    ports: ['3306:3306']
    volumes: ['mysql-data:/var/lib/mysql']
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: loopambiental
      MINIO_ROOT_PASSWORD: loopambiental_local
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio-data:/data']
  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']
volumes:
  mysql-data:
  minio-data:
